aid: infra
name: Infra
description: >-
  Infra is open-source authentication and access management for infrastructure. It
  grants short-lived, identity-based access to Kubernetes clusters, servers, and
  databases by connecting an organization's OIDC identity providers (Okta, Google,
  Azure AD, and others) to fine-grained grants on destination resources. Users and
  groups receive least-privilege roles, access keys are issued for CI/CD and API
  automation, and the `infra` CLI lets engineers list and switch into destinations.
  The project was originally added to the API Evangelist network as an 8vc portfolio
  lead; the hosted service at api.infrahq.com has since wound down (infrahq.com now
  redirects to the GitHub repository), but the source, OpenAPI spec, CLI, and Go
  client remain available under the Elastic License 2.0 (core) and MIT (SDK and
  connectors). Final release: v0.21.0.
