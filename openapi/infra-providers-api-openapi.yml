components:
  schemas:
    Error:
      properties:
        code:
          format: int32
          type: integer
        fieldErrors:
          items:
            properties:
              errors:
                items:
                  type: string
                type: array
              fieldName:
                type: string
            type: object
          type: array
        message:
          type: string
    ListResponse_Provider:
      properties:
        count:
          description: Total number of items on the current page
          example: '100'
          format: int
          type: integer
        items:
          items:
            properties:
              authURL:
                description: Authorize endpoint for the OIDC provider
                example: https://example.com/oauth2/v1/authorize
                type: string
              clientID:
                description: Client ID for the OIDC provider
                example: 0oapn0qwiQPiMIyR35d6
                type: string
              created:
                description: formatted as an RFC3339 date-time
                example: '2022-03-14T09:48:00Z'
                format: date-time
                type: string
              id:
                description: Provider ID
                example: 4yJ3n3D8E2
                format: uid
                pattern: '[1-9a-km-zA-HJ-NP-Z]{1,11}'
                type: string
              kind:
                description: Kind of provider
                example: oidc
                type: string
              name:
                description: Name of the provider
                example: okta
                type: string
              scopes:
                description: Scopes set in the OIDC provider configuration
                example: '[''openid'', ''email'']'
                items:
                  description: Scopes set in the OIDC provider configuration
                  example: '[''openid'', ''email'']'
                  type: string
                type: array
              updated:
                description: formatted as an RFC3339 date-time
                example: '2022-03-14T09:48:00Z'
                format: date-time
                type: string
              url:
                description: URL of the Infra Server
                example: infrahq.okta.com
                type: string
            type: object
          type: array
        limit:
          description: Number of objects per page
          example: '100'
          format: int
          type: integer
        page:
          description: Page number retrieved
          example: '1'
          format: int
          type: integer
        totalCount:
          description: Total number of objects
          example: '485'
          format: int
          type: integer
        totalPages:
          description: Total number of pages
          example: '5'
          format: int
          type: integer
    EmptyResponse: {}
    Provider:
      properties:
        authURL:
          description: Authorize endpoint for the OIDC provider
          example: https://example.com/oauth2/v1/authorize
          type: string
        clientID:
          description: Client ID for the OIDC provider
          example: 0oapn0qwiQPiMIyR35d6
          type: string
        created:
          description: formatted as an RFC3339 date-time
          example: '2022-03-14T09:48:00Z'
          format: date-time
          type: string
        id:
          description: Provider ID
          example: 4yJ3n3D8E2
          format: uid
          pattern: '[1-9a-km-zA-HJ-NP-Z]{1,11}'
          type: string
        kind:
          description: Kind of provider
          example: oidc
          type: string
        name:
          description: Name of the provider
          example: okta
          type: string
        scopes:
          description: Scopes set in the OIDC provider configuration
          example: '[''openid'', ''email'']'
          items:
            description: Scopes set in the OIDC provider configuration
            example: '[''openid'', ''email'']'
            type: string
          type: array
        updated:
          description: formatted as an RFC3339 date-time
          example: '2022-03-14T09:48:00Z'
          format: date-time
          type: string
        url:
          description: URL of the Infra Server
          example: infrahq.okta.com
          type: string
