openapi: 3.0.0
info:
  description: Infra API
  license:
    name: Elastic License v2.0
    url: https://www.elastic.co/licensing/elastic-license
  title: Infra Authentication Destinations API
  version: 0.0.0
servers:
- url: https://api.infrahq.com
tags:
- name: Destinations
paths:
  /api/destinations:
    get:
      description: ListDestinations
      operationId: ListDestinations
      parameters:
      - in: header
        name: Infra-Version
        required: true
        schema:
          description: Version of the API being requested
          example: 0.0.0
          format: \d+\.\d+\(.\d+)?(-.\w(+\w)?)?
          type: string
      - in: header
        name: Authorization
        required: true
        schema:
          description: Bearer followed by your access key
          example: Bearer ACCESSKEY
          format: Bearer [\da-zA-Z]{10}\.[\da-zA-Z]{24}
          type: string
      - description: Name of the destination
        example: production-cluster
        in: query
        name: name
        schema:
          description: Name of the destination
          example: production-cluster
          type: string
      - description: Kind of destination. eg. kubernetes or ssh or postgres
        example: kubernetes
        in: query
        name: kind
        schema:
          description: Kind of destination. eg. kubernetes or ssh or postgres
          example: kubernetes
          type: string
      - description: Unique ID generated by the connector
        example: 94c2c570a20311180ec325fd56
        in: query
        name: unique_id
        schema:
          description: Unique ID generated by the connector
          example: 94c2c570a20311180ec325fd56
          type: string
      - description: Page number to retrieve
        example: '1'
        in: query
        name: page
        schema:
          description: Page number to retrieve
          example: '1'
          format: int
          minimum: 0
          type: integer
      - description: Number of objects to retrieve per page (up to 1000)
        example: '100'
        in: query
        name: limit
        schema:
          description: Number of objects to retrieve per page (up to 1000)
          example: '100'
          format: int
          maximum: 1000
          minimum: 0
          type: integer
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unauthorized: Requestor is not authenticated'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Forbidden: Requestor does not have the right permissions'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Duplicate Record
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_Destination'
          description: Success
      summary: ListDestinations
      tags:
      - Destinations
    post:
      description: CreateDestination
      operationId: CreateDestination
      parameters:
      - in: header
        name: Infra-Version
        required: true
        schema:
          description: Version of the API being requested
          example: 0.0.0
          format: \d+\.\d+\(.\d+)?(-.\w(+\w)?)?
          type: string
      - in: header
        name: Authorization
        required: true
        schema:
          description: Bearer followed by your access key
          example: Bearer ACCESSKEY
          format: Bearer [\da-zA-Z]{10}\.[\da-zA-Z]{24}
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                connection:
                  description: Object that includes the URL and CA for the destination
                  properties:
                    ca:
                      example: '-----BEGIN CERTIFICATE-----

                        MIIDNTCCAh2gAwIBAgIRALRetnpcTo9O3V2fAK3ix+c

                        -----END CERTIFICATE-----

                        '
                      type: string
                    url:
                      example: aa60eexample.us-west-2.elb.amazonaws.com
                      type: string
                  required:
                  - ca
                  type: object
                kind:
                  description: Kind of destination. eg. kubernetes or ssh or postgres
                  enum:
                  - kubernetes
                  - ssh
                  - ''
                  example: kubernetes
                  type: string
                name:
                  description: Name of the destination
                  example: production-cluster
                  format: '[a-zA-Z0-9\-_]'
                  maxLength: 256
                  minLength: 2
                  type: string
                resources:
                  items:
                    type: string
                  type: array
                roles:
                  items:
                    type: string
                  type: array
                uniqueID:
                  description: Unique ID used to identify this specific destination
                  example: 94c2c570a20311180ec325fd56
                  type: string
                version:
                  description: Application version of the connector for this destination
                  type: string
              required:
              - name
              type: object
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unauthorized: Requestor is not authenticated'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Forbidden: Requestor does not have the right permissions'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Duplicate Record
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
          description: Success
      summary: CreateDestination
      tags:
      - Destinations
  /api/destinations/{id}:
    delete:
