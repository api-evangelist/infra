components:
  schemas:
    ListResponse_Destination:
      properties:
        count:
          description: Total number of items on the current page
          example: '100'
          format: int
          type: integer
        items:
          items:
            properties:
              connected:
                description: Shows if the destination is currently connected
                example: 'true'
                type: boolean
              connection:
                description: Object that includes the URL and CA for the destination
                properties:
                  ca:
                    example: '-----BEGIN CERTIFICATE-----

                      MIIDNTCCAh2gAwIBAgIRALRetnpcTo9O3V2fAK3ix+c

                      -----END CERTIFICATE-----

                      '
                    type: string
                  url:
                    example: aa60eexample.us-west-2.elb.amazonaws.com
                    type: string
                required:
                - ca
                type: object
              created:
                description: Time destination was created
                example: '2022-11-10T23:35:22Z'
                format: date-time
                type: string
              id:
                description: ID of the destination
                example: 7a1b26b33F
                format: uid
                pattern: '[1-9a-km-zA-HJ-NP-Z]{1,11}'
                type: string
              kind:
                description: Kind of destination. eg. kubernetes or ssh or postgres
                example: kubernetes
                type: string
              lastSeen:
                description: formatted as an RFC3339 date-time
                example: '2022-03-14T09:48:00Z'
                format: date-time
                type: string
              name:
                description: Name of the destination
                example: production-cluster
                type: string
              resources:
                description: Destination specific. For Kubernetes, it is the list of namespaces
                example: '[''default'', ''kube-system'']'
                items:
                  description: Destination specific. For Kubernetes, it is the list of namespaces
                  example: '[''default'', ''kube-system'']'
                  type: string
                type: array
              roles:
                description: Destination specific. For Kubernetes, it is the list of cluster roles available on that cluster
                example: '[''cluster-admin'', ''admin'', ''edit'', ''view'', ''exec'', ''logs'', ''port-forward'']'
                items:
                  description: Destination specific. For Kubernetes, it is the list of cluster roles available on that cluster
                  example: '[''cluster-admin'', ''admin'', ''edit'', ''view'', ''exec'', ''logs'', ''port-forward'']'
                  type: string
                type: array
              uniqueID:
                description: Unique ID generated by the connector
                example: 94c2c570a20311180ec325fd56
                type: string
              updated:
                description: Time destination was updated
                example: '2022-12-01T19:48:55Z'
                format: date-time
                type: string
              version:
                description: Application version of the connector for this destination
                type: string
            type: object
          type: array
        limit:
          description: Number of objects per page
          example: '100'
          format: int
          type: integer
        page:
          description: Page number retrieved
          example: '1'
          format: int
          type: integer
        totalCount:
          description: Total number of objects
          example: '485'
          format: int
          type: integer
        totalPages:
          description: Total number of pages
          example: '5'
          format: int
          type: integer
    Destination:
      properties:
        connected:
          description: Shows if the destination is currently connected
          example: 'true'
          type: boolean
        connection:
          description: Object that includes the URL and CA for the destination
          properties:
            ca:
              example: '-----BEGIN CERTIFICATE-----

                MIIDNTCCAh2gAwIBAgIRALRetnpcTo9O3V2fAK3ix+c

                -----END CERTIFICATE-----

                '
              type: string
            url:
              example: aa60eexample.us-west-2.elb.amazonaws.com
              type: string
          required:
          - ca
          type: object
        created:
          description: Time destination was created
          example: '2022-11-10T23:35:22Z'
          format: date-time
          type: string
        id:
          description: ID of the destination
          example: 7a1b26b33F
          format: uid
          pattern: '[1-9a-km-zA-HJ-NP-Z]{1,11}'
          type: string
        kind:
          description: Kind of destination. eg. kubernetes or ssh or postgres
          example: kubernetes
          type: string
        lastSeen:
          description: formatted as an RFC3339 date-time
          example: '2022-03-14T09:48:00Z'
          format: date-time
          type: string
        name:
          description: Name of the destination
          example: production-cluster
          type: string
        resources:
          description: Destination specific. For Kubernetes, it is the list of namespaces
          example: '[''default'', ''kube-system'']'
          items:
            description: Destination specific. For Kubernetes, it is the list of namespaces
            example: '[''default'', ''kube-system'']'
            type: string
          type: array
        roles:
          description: Destination specific. For Kubernetes, it is the list of cluster roles available on that cluster
          example: '[''cluster-admin'', ''admin'', ''edit'', ''view'', ''exec'', ''logs'', ''port-forward'']'
          items:
            description: Destination specific. For Kubernetes, it is the list of cluster roles available on that cluster
            example: '[''cluster-admin'', ''admin'', ''edit'', ''view'', ''exec'', ''logs'', ''port-forward'']'
            type: string
          type: array
        uniqueID:
          description: Unique ID generated by the connector
          example: 94c2c570a20311180ec325fd56
          type: string
        updated:
          description: Time destination was updated
          example: '2022-12-01T19:48:55Z'
          format: date-time
          type: string
        version:
          description: Application version of the connector for this destination
          type: string
    Error:
      properties:
        code:
          format: int32
          type: integer
        fieldErrors:
          items:
            properties:
              errors:
                items:
                  type: string
                type: array
              fieldName:
                type: string
            type: object
          type: array
        message:
          type: string
    EmptyResponse: {}
    CreateTokenResponse:
      properties:
        expires:
          description: formatted as an RFC3339 date-time
          example: '2022-03-14T09:48:00Z'
          format: date-time
          type: string
        token:
          type: string
